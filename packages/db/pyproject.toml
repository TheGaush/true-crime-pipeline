[project]
name = "true-crime-pipeline-db"
version = "0.0.0"
description = "SQLite repositories for the true-crime documentary pipeline (Task 013 slice)"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["entropy_repo"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]