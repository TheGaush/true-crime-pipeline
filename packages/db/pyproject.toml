[project]
name = "pipeline-db"
version = "0.0.1"
description = "Python sole-writer SQLite WAL driver for pipeline.db"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"db" = "src"}
packages = ["db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
