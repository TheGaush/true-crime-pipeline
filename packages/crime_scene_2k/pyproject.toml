[project]
name = "tc-crime-scene-2k"
version = "0.0.0"
description = "2K still tours driven by pre-locked spatial anchors."
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pillow>=10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crime_scene_2k"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
