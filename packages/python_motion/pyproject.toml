[project]
name = "tc-python-motion"
version = "0.0.0"
description = "Deterministic monochrome stickman keyframes and Part 2 raster motion."
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pillow>=10",
  "scipy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python_motion"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
